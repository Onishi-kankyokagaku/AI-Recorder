<!DOCTYPE html>
<html lang="ja">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>AI議事録レコーダー</title>
<style>
    /* 録音中のボタン：深みのある光と鼓動 */
    .recording-active {
        background: linear-gradient(135.2deg, #4CAF50 1.2%, #81C784 98.8%) !important;
        position: relative;
        border: none;
        outline: none;
        box-shadow: 0 0 15px rgba(76, 175, 80, 0.6), 0 0 30px rgba(76, 175, 80, 0.4);
        animation: living-pulse 2.5s infinite ease-in-out;
    }

    @keyframes living-pulse {
        0% { transform: scale(1); filter: brightness(1); box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
        40% { transform: scale(1.03); filter: brightness(1.2); box-shadow: 0 0 0 25px rgba(76, 175, 80, 0); }
        100% { transform: scale(1); filter: brightness(1); box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
    }
    
    #stop:not(:disabled) { animation: stop-alert 2s infinite; }
    @keyframes stop-alert { 0% { opacity: 1; } 50% { opacity: 0.8; } 100% { opacity: 1; } }
    
    body { font-family: sans-serif; text-align: center; padding: 40px 15px; background: #f4f7f6; margin: 0 auto; max-width: 500px; }
    #version-tag { text-align: right; font-size: 0.7rem; color: #999; background: #eee; padding: 2px 8px; border-radius: 10px; display: inline-block; }
    .ver-container { text-align: right; margin-bottom: 10px; }
    h1 { font-size: 1.5rem; color: #333; margin-bottom: 30px; }

    button { font-size: 1.2rem; padding: 20px; margin: 10px 0; border: none; border-radius: 12px; cursor: pointer; transition: 0.3s; width: 100%; max-width: 400px; display: block; margin-left: auto; margin-right: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    #start { background: #4CAF50; color: white; font-weight: bold; }
    #stop { background: #f44336; color: white; font-weight: bold; }
    button:active { transform: translateY(2px); box-shadow: none; }
    button:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; }

    #status { margin-top: 30px; color: #555; font-size: 0.9rem; line-height: 1.6; word-wrap: break-word; text-align: left; background: white; padding: 15px; border-radius: 10px; border: 1px solid #ddd; max-width: 400px; margin-left: auto; margin-right: auto; }
    .ss-link { display: block; margin-top: 15px; padding: 15px; background: #4285f4; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; text-align: center; }

    .system-error { background: #ffebee !important; animation: error-flash 1.2s infinite alternate ease-in-out; }
    @keyframes error-flash { 0% { background: #ffebee; } 100% { background: #ffcdd2; } }
    .error-status-text { color: #d32f2f !important; border: 3px solid #d32f2f !important; background: #ffffff !important; box-shadow: 0 0 15px rgba(211, 47, 47, 0.2) !important; }

    .qr-container { margin: 20px auto; padding: 15px; background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: inline-block; text-align: center; }
    .qr-container svg { display: block; margin: 0 auto; width: 200px; height: 200px; }

    #debug-log {
        margin-top: 20px;
        background: #222;
        color: #00ff66;
        font-family: monospace;
        font-size: 0.75rem;
        text-align: left;
        padding: 10px;
        border-radius: 8px;
        height: 160px;
        overflow-y: auto;
        word-break: break-all;
        max-width: 400px;
        margin-left: auto;
        margin-right: auto;
    }
</style>
</head>
<body>
    <div class="ver-container">
        <span id="version-tag">Ver. 1.4.1 (AudioWorklet + OPFS Lock-Free)</span>
    </div>

    <h1>AI議事録レコーダー</h1>
    <button id="recover-btn" style="background: #ff9800; color: white; display: none;">
        💾 未送信の音声データを端末に保存する
    </button>
    
    <button id="start">● 録音開始</button>
    <button id="stop" disabled>■ 停止・議事録作成</button>
    <p id="status">システム初期化中（スプレッドシート作成中）...</p>

    <div id="debug-log">--- 動作ログモニター ---</div>

    <audio id="silent-audio" loop>
        <source src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=" type="audio/wav">
    </audio>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwnThA6GO1XmW9ub9GnIYKNZGl23tPAqheTpRo5MGAtrw3iJpSwv_GKRmQqJmZML65m/exec";
    
    let currentSsId = null; 
    let currentSsUrl = null; 
    let currentLogRow = null; 
    
    let audioCtx = null;
    let audioSource = null;
    let workletNode = null;
    let mediaStream = null;

    let isFinalAction = false;
    let worker = null;
    let sendCount = 0; 
    let wakeLock = null;

    let sendQueue = [];
    let isSending = false;

    // --- OPFS & 排他制御設定 ---
    const TARGET_SAMPLE_RATE = 16000;
    const THREE_MIN_SAMPLES = TARGET_SAMPLE_RATE * 180; // 3分間＝288万サンプル
    
    let opfsRoot = null;
    let opfsFileHandle = null;
    let opfsWritable = null;
    let samplesWrittenInChunk = 0;
    let isFlushing = false; // 連打防止フラグ

    // 一時書き込みキュー
    let writeQueue = [];
    let isWriting = false;

    const status = document.getElementById('status');
    const startBtn = document.getElementById('start');
    const stopBtn = document.getElementById('stop');
    const silentAudio = document.getElementById('silent-audio');
    const recoverBtn = document.getElementById('recover-btn');
    const debugLog = document.getElementById('debug-log');

    startBtn.disabled = true;

    function log(msg) {
        console.log(msg);
        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
        debugLog.innerHTML += `<br>[${timeStr}] ${msg}`;
        debugLog.scrollTop = debugLog.scrollHeight;
    }

    const requestWakeLock = async () => {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
                log("画面スリープ防止：有効");
                wakeLock.addEventListener('release', () => { log("画面スリープ防止：解除されました"); });
            }
        } catch (err) {
            log(`WakeLockエラー: ${err.name}, ${err.message}`);
        }
    };

    function triggerNetworkErrorScreen(type, errorMsg) {
        log(`通信エラー発生 (${type}): ${errorMsg}`);
        document.body.classList.add('system-error');
        status.classList.add('error-status-text');
        status.innerHTML = `
            <div style="text-align:center; padding: 10px;">
                <span style="font-size: 1.8rem; font-weight: bold;">⚠️ 通信エラー発生 (${type})</span><br><br>
                <strong style="color:#d32f2f; font-size: 1.1rem;">データの送信・接続に失敗しました。</strong><br>
                <span style="font-size:0.9rem; color:#333;">電波環境の良い場所へ移動するか、Wi-Fiを確認してください。</span>
            </div>
            <hr style="border: 0; border-top: 1px solid #d32f2f; margin: 15px 0;">
            <span style="font-size:0.75rem; color:#777;">[エラー詳細]: ${errorMsg}</span>
        `;
        cleanupAudio();
        if (silentAudio) { silentAudio.pause(); silentAudio.currentTime = 0; }
        startBtn.classList.remove('recording-active');
        startBtn.innerText = "● 録音停止（エラー検出）";

        checkUnsentData();
    }
    
    function generateQRishest(text) {
        const url = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(text)}`;
        return `<img src="${url}" width="200" height="200" alt="QR Code" style="display:block; margin:0 auto; border:none;">`;
    }

    function processNextQueue() {
        if (isSending || sendQueue.length === 0) return;

        isSending = true;
        const task = sendQueue.shift();
        log(`No.${task.index} 送信開始... (待機中: ${sendQueue.length}件)`);

        worker.postMessage({
            floatArray: task.floatArray,
            sampleRate: task.sampleRate,
            type: task.type,
            index: task.index,
            gasUrl: GAS_URL,
            ssId: currentSsId,
            logRow: currentLogRow
        }, [task.floatArray.buffer]);
    }

    worker = new Worker('worker.js');

    worker.onmessage = (e) => {
        const data = e.data;
        
        if (data.status !== 'retrying') {
            isSending = false;
        }

        if (data.status === 'retrying') {
            log(`通信不安定: 再送試行中 (${data.attempt}/${data.maxRetries})...`);
            status.innerHTML = `⚠️ 通信不安定のため再接続中 (${data.attempt}/${data.maxRetries})...録音は継続中`;
            return;
        }

        if (data.status === 'warning_offline') {
            log(`No.${data.index} 通信失敗のためローカルへ保存しました`);
            status.innerHTML = `⚠️ ネットワークエラー。パート${data.index}を端末内に一次保存しました。`;
            checkUnsentData();
            processNextQueue();
            return;
        }

        if (data.status === 'success') {
            if (data.type === 'init') {
                currentSsId = data.result.ssId;
                currentSsUrl = data.result.url; 
                currentLogRow = data.result.logRow;
                startBtn.disabled = false;
                status.innerHTML = "準備完了";
                log("スプレッドシートを確保しました");
                return;
            }
            
            if (data.type === 'final') {
                const qrHtml = generateQRishest(currentSsUrl);
                
                status.innerHTML = `
                    <h3>✨ 議事録が完成しました</h3>
                    <a href="${currentSsUrl}" target="_blank" class="ss-link">議事録を確認する ↗</a>
                    <div class="qr-container">
                        <p style="margin: 0 0 10px 0; font-size: 0.85rem; color: #333; font-weight: bold;">
                            📸 PCやスマホでスキャンして手元で開く
                        </p>
                        ${qrHtml}
                    </div>
                    <p style="margin-top: 15px; font-size: 0.9rem; color: #666;">※議事録上部のボタンからダウンロード可能です。</p>
                `;
                log("全工程が完了しました。");

                silentAudio.pause();
                silentAudio.currentTime = 0;
                cleanupAudio();
                if (wakeLock !== null) { wakeLock.release().then(() => { wakeLock = null; }); }                
                window.onbeforeunload = null;
            } else if (data.type === 'memo') {
                log(`No.${data.index} 転記完了`);
                status.innerHTML = `録音中... (Part ${data.index} 送信完了)`;
                processNextQueue();
            }
        } else {
            log(`エラー (${data.type}): ${data.error}`);
            triggerNetworkErrorScreen(data.type, data.error);
        }
    };

    window.onload = async () => {
        if (recoverBtn) {
            recoverBtn.style.display = 'none';
        }
        try {
            opfsRoot = await navigator.storage.getDirectory();
            log("OPFS (ストレージ) 初期化成功");
        } catch (e) {
            log("OPFS非対応エラー: " + e.message);
        }
        log("SS発行リクエスト送信...");
        worker.postMessage({ type: 'init', gasUrl: GAS_URL });
    };

    const workletCode = `
        class PCMProcessor extends AudioWorkletProcessor {
            process(inputs, outputs, parameters) {
                const input = inputs[0];
                if (input && input.length > 0) {
                    const inputChannel = input[0];
                    if (inputChannel && inputChannel.length > 0) {
                        this.port.postMessage(inputChannel);
                    }
                }
                return true;
            }
        }
        registerProcessor('pcm-processor', PCMProcessor);
    `;

    async function initOpfsSegment() {
        if (opfsWritable) {
            try { await opfsWritable.close(); } catch(e){}
        }
        opfsFileHandle = await opfsRoot.getFileHandle(`recording_chunk_${Date.now()}.bin`, { create: true });
        opfsWritable = await opfsFileHandle.createWritable();
        samplesWrittenInChunk = 0;
    }

    // 非同期での書き込みキュー処理（メインスレッドのブロッキングを完全防止）
    async function processWriteQueue() {
        if (isWriting || writeQueue.length === 0 || !opfsWritable) return;
        isWriting = true;

        const chunk = writeQueue.shift();
        try {
            await opfsWritable.write(chunk.buffer);
            samplesWrittenInChunk += chunk.length;

            // 定期的な進捗ログ表示（約10秒ごと）
            if (samplesWrittenInChunk % (TARGET_SAMPLE_RATE * 10) < 512) {
                const sec = (samplesWrittenInChunk / TARGET_SAMPLE_RATE).toFixed(0);
                log(`録音継続中: ${sec}秒経過 / 180秒`);
            }

            // 3分到達判定（重複発火防止）
            if (samplesWrittenInChunk >= THREE_MIN_SAMPLES && !isFlushing) {
                isFlushing = true;
                log("3分到達: OPFSから送信処理を開始します");
                await flushOpfsBuffer(false);
                isFlushing = false;
            }
        } catch (err) {
            console.error("OPFS書き込みエラー:", err);
        } finally {
            isWriting = false;
            if (writeQueue.length > 0) {
                setTimeout(processWriteQueue, 0);
            }
        }
    }

    async function flushOpfsBuffer(isFinal) {
        if (!opfsWritable || samplesWrittenInChunk === 0) return;

        sendCount++;
        let currentIndex = sendCount;
        let sendType = isFinal ? "final" : "memo";
        
        const currentHandle = opfsFileHandle;
        const currentWritable = opfsWritable;

        if (!isFinal) {
            await initOpfsSegment();
        } else {
            opfsWritable = null;
            opfsFileHandle = null;
        }

        await currentWritable.close();
        const file = await currentHandle.getFile();
        const arrayBuffer = await file.arrayBuffer();

        const floatArray = new Float32Array(arrayBuffer);

        log(`Part ${currentIndex} (${sendType}) OPFS読み出し完了 (${(floatArray.length / TARGET_SAMPLE_RATE).toFixed(1)}秒分)`);

        sendQueue.push({
            floatArray: floatArray,
            sampleRate: TARGET_SAMPLE_RATE,
            type: sendType,
            index: currentIndex
        });

        try {
            await opfsRoot.removeEntry(currentHandle.name);
        } catch (e) {
            console.warn("OPFSファイル削除失敗:", e);
        }

        processNextQueue();
    }

    function cleanupAudio() {
        if (workletNode) { workletNode.disconnect(); workletNode = null; }
        if (audioSource) { audioSource.disconnect(); audioSource = null; }
        if (mediaStream) { mediaStream.getTracks().forEach(track => track.stop()); mediaStream = null; }
        if (audioCtx) { audioCtx.close(); audioCtx = null; }
    }

    startBtn.onclick = async () => {
        startBtn.classList.add('recording-active');
        startBtn.innerText = "● 録音中..."; 
        await requestWakeLock();

        window.onbeforeunload = (e) => {
            e.preventDefault();
            return "録音中にページを離れるとデータが失われます。";
        };

        if (currentLogRow) { worker.postMessage({ type: 'recording', gasUrl: GAS_URL, logRow: currentLogRow }); }
        try {
            isFinalAction = false;
            sendCount = 0; 
            sendQueue = [];
            isSending = false;
            writeQueue = [];
            isWriting = false;
            isFlushing = false;
            
            await initOpfsSegment();

            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const nativeSampleRate = audioCtx.sampleRate;
            log(`マイク認識サンプルレート: ${nativeSampleRate} Hz`);

            mediaStream = await navigator.mediaDevices.getUserMedia({ 
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true
                }
            });

            const blob = new Blob([workletCode], { type: 'application/javascript' });
            const workletUrl = URL.createObjectURL(blob);
            await audioCtx.audioWorklet.addModule(workletUrl);
            URL.revokeObjectURL(workletUrl);

            audioSource = audioCtx.createMediaStreamSource(mediaStream);
            workletNode = new AudioWorkletNode(audioCtx, 'pcm-processor');

            const ratio = nativeSampleRate / TARGET_SAMPLE_RATE;

            // 同期でキューに追加し、非同期ループで順番にディスクへ書き出し
            workletNode.port.onmessage = (e) => {
                const inputData = e.data;
                const downsampled = [];
                for (let i = 0; i < inputData.length; i += ratio) {
                    const idx = Math.floor(i);
                    if (idx < inputData.length) {
                        downsampled.push(inputData[idx]);
                    }
                }

                if (downsampled.length > 0) {
                    writeQueue.push(new Float32Array(downsampled));
                    processWriteQueue();
                }
            };

            audioSource.connect(workletNode);
            const dummyGain = audioCtx.createGain();
            dummyGain.gain.value = 0;
            workletNode.connect(dummyGain);
            dummyGain.connect(audioCtx.destination);

            silentAudio.play();

            startBtn.disabled = true;
            stopBtn.disabled = false;
            status.innerHTML = "録音中...";
            log("AudioWorklet + OPFS ストリーミング録音開始");

        } catch (err) {
            log("開始エラー: " + err.message);
        }
    };

    stopBtn.onclick = async () => {
        isFinalAction = true;
        startBtn.classList.remove('recording-active');
        startBtn.innerText = "● 録音開始";
        
        log("停止ボタンが押されました");

        cleanupAudio();

        // ディスクへの書き込み残分が完了するのを少し待ってから最終送信
        setTimeout(async () => {
            if (samplesWrittenInChunk > 0) {
                await flushOpfsBuffer(true);
            }
        }, 300);

        status.innerHTML = "最終データを解析中...";
        stopBtn.disabled = true;
    };

    document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible') { await requestWakeLock(); }
    });

    async function checkUnsentData() {
        const request = indexedDB.open('AIRecorderDB', 1);
        request.onsuccess = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('audioQueue')) return;
            const tx = db.transaction('audioQueue', 'readonly');
            const store = tx.objectStore('audioQueue');
            const countReq = store.count();
            countReq.onsuccess = () => {
                if (countReq.result > 0) {
                    recoverBtn.style.display = 'block';
                    log(`未送信データが ${countReq.result} 件残っています。`);
                }
            };
        };
    }

    recoverBtn.onclick = async () => {
        const request = indexedDB.open('AIRecorderDB', 1);
        request.onsuccess = (e) => {
            const db = e.target.result;
            const tx = db.transaction('audioQueue', 'readonly');
            const store = tx.objectStore('audioQueue');
            const getAllReq = store.getAll();

            getAllReq.onsuccess = () => {
                const items = getAllReq.result;
                if (items.length === 0) {
                    alert("救出できるデータはありません。");
                    return;
                }

                items.forEach((item) => {
                    const byteCharacters = atob(item.audio);
                    const byteNumbers = new Array(byteCharacters.length);
                    for (let i = 0; i < byteCharacters.length; i++) {
                        byteNumbers[i] = byteCharacters.charCodeAt(i);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    const blob = new Blob([byteArray], { type: 'audio/mpeg' });

                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `backup_part_${item.index}.mp3`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                });

                const clearTx = db.transaction('audioQueue', 'readwrite');
                const clearStore = clearTx.objectStore('audioQueue');
                const clearReq = clearStore.clear();

                clearReq.onsuccess = () => {
                    alert(`${items.length} 件の音声ファイルをダウンロードし、端末内の一次保存データを削除しました。`);
                    recoverBtn.style.display = 'none';
                };

                clearReq.onerror = () => {
                    alert(`${items.length} 件の音声ファイルをダウンロードしました。（ローカルデータの削除に失敗しました）`);
                };
            };
        };
    };
</script>
</body>
</html>
