<!DOCTYPE html>
<html lang="ja">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>AI議事録レコーダー</title>
<style>
    /* 録音中のボタン：深みのある光と鼓動 */
    .recording-active {
        background: linear-gradient(135.2deg, #4CAF50 1.2%, #81C784 98.8%) !important;
        position: relative;
        border: none;
        outline: none;
        box-shadow: 0 0 15px rgba(76, 175, 80, 0.6), 0 0 30px rgba(76, 175, 80, 0.4);
        animation: living-pulse 2.5s infinite ease-in-out;
    }

    @keyframes living-pulse {
        0% { transform: scale(1); filter: brightness(1); box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
        40% { transform: scale(1.03); filter: brightness(1.2); box-shadow: 0 0 0 25px rgba(76, 175, 80, 0); }
        100% { transform: scale(1); filter: brightness(1); box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
    }
    
    #stop:not(:disabled) { animation: stop-alert 2s infinite; }
    @keyframes stop-alert { 0% { opacity: 1; } 50% { opacity: 0.8; } 100% { opacity: 1; } }
    
    body { font-family: sans-serif; text-align: center; padding: 40px 15px; background: #f4f7f6; margin: 0 auto; max-width: 500px; }
    #version-tag { text-align: right; font-size: 0.7rem; color: #999; background: #eee; padding: 2px 8px; border-radius: 10px; display: inline-block; }
    .ver-container { text-align: right; margin-bottom: 10px; }
    h1 { font-size: 1.5rem; color: #333; margin-bottom: 30px; }

    button { font-size: 1.2rem; padding: 20px; margin: 10px 0; border: none; border-radius: 12px; cursor: pointer; transition: 0.3s; width: 100%; max-width: 400px; display: block; margin-left: auto; margin-right: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    #start { background: #4CAF50; color: white; font-weight: bold; }
    #stop { background: #f44336; color: white; font-weight: bold; }
    button:active { transform: translateY(2px); box-shadow: none; }
    button:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; }

    #status { margin-top: 30px; color: #555; font-size: 0.9rem; line-height: 1.6; word-wrap: break-word; text-align: left; background: white; padding: 15px; border-radius: 10px; border: 1px solid #ddd; max-width: 400px; margin-left: auto; margin-right: auto; }
    .ss-link { display: block; margin-top: 15px; padding: 15px; background: #4285f4; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; text-align: center; }

    .system-error { background: #ffebee !important; animation: error-flash 1.2s infinite alternate ease-in-out; }
    @keyframes error-flash { 0% { background: #ffebee; } 100% { background: #ffcdd2; } }
    .error-status-text { color: #d32f2f !important; border: 3px solid #d32f2f !important; background: #ffffff !important; box-shadow: 0 0 15px rgba(211, 47, 47, 0.2) !important; }

    .qr-container { margin: 20px auto; padding: 15px; background: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: inline-block; text-align: center; }
    .qr-container svg { display: block; margin: 0 auto; width: 200px; height: 200px; }
</style>
</head>
<body>
    <div class="ver-container">
        <span id="version-tag">Ver. 1.1.22</span>
    </div>

    <h1>AI議事録レコーダー</h1>
    <button id="recover-btn" style="background: #ff9800; color: white; display: none;">
        💾 未送信の音声データを端末に保存する
    </button>
    
    <button id="start">● 録音開始</button>
    <button id="stop" disabled>■ 停止・議事録作成</button>
    <p id="status">システム初期化中（スプレッドシート作成中）...</p>

    <audio id="silent-audio" loop>
        <source src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=" type="audio/wav">
    </audio>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwnThA6GO1XmW9ub9GnIYKNZGl23tPAqheTpRo5MGAtrw3iJpSwv_GKRmQqJmZML65m/exec";
    
    let currentSsId = null; 
    let currentSsUrl = null; 
    let currentLogRow = null; 
    let rec = null, audioCtx = null;
    let isFinalAction = false;
    let worker = null;
    let sendCount = 0; 
    let wakeLock = null;

    let sendQueue = [];
    let isSending = false;

    let shortChunksBuffer = [];
    let currentStream = null;

    const status = document.getElementById('status');
    const startBtn = document.getElementById('start');
    const stopBtn = document.getElementById('stop');
    const silentAudio = document.getElementById('silent-audio');
    const recoverBtn = document.getElementById('recover-btn');

    startBtn.disabled = true;

    let logMessages = [];
    function log(msg) {
        console.log(msg);
        logMessages.push(`[Log] ${msg}`);
        if (logMessages.length > 10) logMessages.shift();
    }

    const requestWakeLock = async () => {
        try {
            if ('wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
                log("画面スリープ防止：有効");
                wakeLock.addEventListener('release', () => { log("画面スリープ防止：解除されました"); });
            }
        } catch (err) {
            log(`WakeLockエラー: ${err.name}, ${err.message}`);
        }
    };

    function triggerNetworkErrorScreen(type, errorMsg) {
        log(`通信エラー発生 (${type}): ${errorMsg}`);
        document.body.classList.add('system-error');
        status.classList.add('error-status-text');
        status.innerHTML = `
            <div style="text-align:center; padding: 10px;">
                <span style="font-size: 1.8rem; font-weight: bold;">⚠️ 通信エラー発生 (${type})</span><br><br>
                <strong style="color:#d32f2f; font-size: 1.1rem;">データの送信・接続に失敗しました。</strong><br>
                <span style="font-size:0.9rem; color:#333;">電波環境の良い場所へ移動するか、Wi-Fiを確認してください。</span>
            </div>
            <hr style="border: 0; border-top: 1px solid #d32f2f; margin: 15px 0;">
            <span style="font-size:0.75rem; color:#777;">[エラー詳細]: ${errorMsg}</span>
        `;
        if (rec && rec.state !== "inactive") {
            rec.stop();
            if (rec.stream) rec.stream.getTracks().forEach(track => track.stop());
        }
        if (silentAudio) { silentAudio.pause(); silentAudio.currentTime = 0; }
        startBtn.classList.remove('recording-active');
        startBtn.innerText = "● 録音停止（エラー検出）";

        checkUnsentData();
    }
    
    function generateQRishest(text) {
        const url = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(text)}`;
        return `<img src="${url}" width="200" height="200" alt="QR Code" style="display:block; margin:0 auto; border:none;">`;
    }

    function processNextQueue() {
        if (isSending || sendQueue.length === 0) return;

        isSending = true;
        const task = sendQueue.shift();
        log(`No.${task.index} 送信開始... (待機中: ${sendQueue.length}件)`);

        worker.postMessage({
            floatArray: task.floatArray,
            sampleRate: task.sampleRate,
            type: task.type,
            index: task.index,
            gasUrl: GAS_URL,
            ssId: currentSsId,
            logRow: currentLogRow
        }, [task.floatArray.buffer]);
    }

    worker = new Worker('worker.js');

    worker.onmessage = (e) => {
        const data = e.data;
        
        if (data.status !== 'retrying') {
            isSending = false;
        }

        if (data.status === 'retrying') {
            log(`通信不安定: 再送試行中 (${data.attempt}/${data.maxRetries})...`);
            status.innerHTML = `⚠️ 通信不安定のため再接続中 (${data.attempt}/${data.maxRetries})...録音は継続中`;
            return;
        }

        if (data.status === 'warning_offline') {
            log(`No.${data.index} 通信失敗のためローカルへ保存しました`);
            status.innerHTML = `⚠️ ネットワークエラー。パート${data.index}を端末内に一次保存しました。`;
            checkUnsentData();
            processNextQueue();
            return;
        }

        if (data.status === 'success') {
            if (data.type === 'init') {
                currentSsId = data.result.ssId;
                currentSsUrl = data.result.url; 
                currentLogRow = data.result.logRow;
                startBtn.disabled = false;
                status.innerHTML = "準備完了";
                log("スプレッドシートを確保しました");
                return;
            }
            
            if (data.type === 'final') {
                const qrHtml = generateQRishest(currentSsUrl);
                
                status.innerHTML = `
                    <h3>✨ 議事録が完成しました</h3>
                    <a href="${currentSsUrl}" target="_blank" class="ss-link">議事録を確認する ↗</a>
                    <div class="qr-container">
                        <p style="margin: 0 0 10px 0; font-size: 0.85rem; color: #333; font-weight: bold;">
                            📸 PCやスマホでスキャンして手元で開く
                        </p>
                        ${qrHtml}
                    </div>
                    <p style="margin-top: 15px; font-size: 0.9rem; color: #666;">※議事録上部のボタンからダウンロード可能です。</p>
                `;
                log("全工程が完了しました。");

                silentAudio.pause();
                silentAudio.currentTime = 0;
                if (audioCtx) { audioCtx.close(); audioCtx = null; } 
                if (wakeLock !== null) { wakeLock.release().then(() => { wakeLock = null; }); }                
                window.onbeforeunload = null;
            } else if (data.type === 'memo') {
                log(`No.${data.index} 転記完了`);
                status.innerHTML = `録音中... (Part ${data.index} 送信完了)`;
                processNextQueue();
            }
        } else {
            log(`エラー (${data.type}): ${data.error}`);
            triggerNetworkErrorScreen(data.type, data.error);
        }
    };

    window.onload = () => {
        if (recoverBtn) {
            recoverBtn.style.display = 'none';
        }
        log("SS発行リクエスト送信...");
        worker.postMessage({ type: 'init', gasUrl: GAS_URL });
    };

    // ★修正：3分（6個）ごとに送信後も自動継続してパート2、パート3を処理するロジック
    const startRecordingSession = (stream) => {
        rec = new MediaRecorder(stream);

        rec.ondataavailable = async (e) => {
            if (e.data.size > 0) {
                shortChunksBuffer.push(e.data);
                log(`30秒チャンク取得 (${shortChunksBuffer.length}/6個)`);

                // 6個（3分）に達したら送信関数を実行
                if (shortChunksBuffer.length >= 6) {
                    await processAndSendBuffer(false);
                }
            }
        };

        // 30秒ごとにデータを受け取る
        rec.start(30000);
    };

    // バッファの結合・デコード・送信処理
    const processAndSendBuffer = async (isFinal) => {
        if (shortChunksBuffer.length === 0) return;

        // 送信対象の30秒チャンク群をコピーしてバッファを即時クリア
        const chunksToProcess = [...shortChunksBuffer];
        shortChunksBuffer = []; 

        sendCount++;
        let currentIndex = sendCount;
        let sendType = isFinal ? "final" : "memo";

        log(`Part ${currentIndex} (${sendType}) の結合・デコード開始...`);

        const blob3min = new Blob(chunksToProcess, { type: 'audio/webm' });
        const arrayBuffer = await blob3min.arrayBuffer();

        const tempAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        tempAudioCtx.decodeAudioData(arrayBuffer, (buffer) => {
            const channelData = buffer.getChannelData(0);
            const floatArray = new Float32Array(channelData);

            sendQueue.push({
                floatArray: floatArray,
                sampleRate: buffer.sampleRate,
                type: sendType,
                index: currentIndex
            });

            tempAudioCtx.close();
            processNextQueue();
        }, (err) => {
            log("デコードエラー: " + err.message);
            tempAudioCtx.close();
        });
    };

    startBtn.onclick = async () => {
        startBtn.classList.add('recording-active');
        startBtn.innerText = "● 録音中..."; 
        await requestWakeLock();

        window.onbeforeunload = (e) => {
            e.preventDefault();
            return "録音中にページを離れるとデータが失われます。";
        };

        if (currentLogRow) { worker.postMessage({ type: 'recording', gasUrl: GAS_URL, logRow: currentLogRow }); }
        try {
            isFinalAction = false;
            sendCount = 0; 
            sendQueue = [];
            isSending = false;
            shortChunksBuffer = [];

            currentStream = await navigator.mediaDevices.getUserMedia({ 
                audio: {
                    sampleRate: 16000,
                    channelCount: 1,
                    echoCancellation: true,
                    noiseSuppression: true
                }
            });
            silentAudio.play();
            startRecordingSession(currentStream);

            startBtn.disabled = true;
            stopBtn.disabled = false;
            status.innerHTML = "録音中...";
        } catch (err) {
            log("開始エラー: " + err.message);
        }
    };

    stopBtn.onclick = async () => {
        isFinalAction = true;
        startBtn.classList.remove('recording-active');
        startBtn.innerText = "● 録音開始";
        
        if (rec && rec.state !== "inactive") {
            rec.stop();
        }
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
        }

        // 停止ボタンが押された時点で残っているチャンクがあれば最終送信（final）を実行
        setTimeout(async () => {
            if (shortChunksBuffer.length > 0) {
                await processAndSendBuffer(true);
            }
        }, 500);

        status.innerHTML = "最終データを解析中...";
        stopBtn.disabled = true;
    };

    document.addEventListener('visibilitychange', async () => {
        if (wakeLock !== null && document.visibilityState === 'visible') { await requestWakeLock(); }
    });

    async function checkUnsentData() {
        const request = indexedDB.open('AIRecorderDB', 1);
        request.onsuccess = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('audioQueue')) return;
            const tx = db.transaction('audioQueue', 'readonly');
            const store = tx.objectStore('audioQueue');
            const countReq = store.count();
            countReq.onsuccess = () => {
                if (countReq.result > 0) {
                    recoverBtn.style.display = 'block';
                    log(`未送信データが ${countReq.result} 件残っています。`);
                }
            };
        };
    }

    recoverBtn.onclick = async () => {
        const request = indexedDB.open('AIRecorderDB', 1);
        request.onsuccess = (e) => {
            const db = e.target.result;
            const tx = db.transaction('audioQueue', 'readonly');
            const store = tx.objectStore('audioQueue');
            const getAllReq = store.getAll();

            getAllReq.onsuccess = () => {
                const items = getAllReq.result;
                if (items.length === 0) {
                    alert("救出できるデータはありません。");
                    return;
                }

                items.forEach((item) => {
                    const byteCharacters = atob(item.audio);
                    const byteNumbers = new Array(byteCharacters.length);
                    for (let i = 0; i < byteCharacters.length; i++) {
                        byteNumbers[i] = byteCharacters.charCodeAt(i);
                    }
                    const byteArray = new Uint8Array(byteNumbers);
                    const blob = new Blob([byteArray], { type: 'audio/mpeg' });

                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `backup_part_${item.index}.mp3`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                });

                setTimeout(() => {
                    const isConfirmed = confirm(`${items.length} 件のファイルを保存用にダウンロードしました。\n\n端末内に残っている未送信データを削除してもよろしいですか？\n（キャンセルを押すとデータを残したままにします）`);

                    if (isConfirmed) {
                        const clearTx = db.transaction('audioQueue', 'readwrite');
                        const clearStore = clearTx.objectStore('audioQueue');
                        const clearReq = clearStore.clear();

                        clearReq.onsuccess = () => {
                            alert("端末内の未送信データを削除しました。");
                            recoverBtn.style.display = 'none';
                        };
                    } else {
                        alert("データは削除されずに端末内に保持されています。");
                    }
                }, 500);
            };
        };
    };
</script>
</body>
</html>
